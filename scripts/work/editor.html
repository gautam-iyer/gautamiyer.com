<!doctype html>
<meta charset="utf-8">
<title>Essay editor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#fff; --ink:#111; --dark:#2a2a2a; --mid:#666; --light:#999; --line:#e6e6e6;
  --accent:#2a5c9e; --warn:#b3872a; --rail:260px;
  --text-width:648px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 var(--sans);color:var(--ink);background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}

/* ── rail ───────────────────────────────────────────────── */
#rail{position:fixed;inset:0 auto 0 0;width:var(--rail);border-right:1px solid var(--line);
      overflow-y:auto;background:#fafafa;padding:14px 0}
#rail h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--light);
      margin:0 0 10px;padding:0 16px;font-weight:600}
.ess{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 16px;cursor:pointer;border-left:2px solid transparent}
.ess:hover{background:#f0f0f0}
.ess.on{background:#fff;border-left-color:var(--ink)}
.ess .t{font-weight:600;font-size:13px;line-height:1.35}
.ess .m{font-size:11px;color:var(--light);margin-top:2px}

/* ── surface ────────────────────────────────────────────── */
#main{margin-left:var(--rail)}
#topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line);padding:8px 20px;display:flex;gap:10px;align-items:center}
#topbar .sp{flex:1}
.status{font-size:12px;color:var(--light)}
.status.saving{color:var(--warn)}
.status.saved{color:#3a7d44}
.tb{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 9px;cursor:pointer}
.tb:hover{border-color:var(--mid)}

#doc{max-width:var(--text-width);margin:0 auto;padding:44px 20px 55vh}
#title,#subtitle{width:100%;border:0;outline:0;background:none;display:block;padding:0;resize:none;overflow:hidden}
#title{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:10px;font-family:var(--sans)}
#subtitle{font-size:1.02rem;color:var(--mid);line-height:1.45;margin-bottom:6px}
#title:empty::before,#subtitle:empty::before{content:attr(data-ph);color:#c8c8c8}
#meta{font-size:12px;color:var(--light);border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:14px}

/* blocks — deliberately mirrors .article-body on the live site */
.blk{position:relative;outline:0}
.blk[data-t="p"]{font-size:.95rem;line-height:1.8;color:var(--dark);margin:0 0 24px}
.blk[data-t="h2"]{font-size:1.15rem;font-weight:600;margin:48px 0 16px;letter-spacing:-.01em;color:var(--ink)}
.blk[data-t="h3"]{font-size:.95rem;font-weight:600;margin:32px 0 12px;color:var(--ink)}
.blk[data-t="quote"]{margin:32px 0;padding-left:20px;border-left:2px solid var(--line);
      font-size:.92rem;line-height:1.75;color:var(--mid);font-style:italic}
.blk[data-t="ul"],.blk[data-t="ol"]{font-size:.95rem;line-height:1.8;color:var(--dark);margin:0 0 24px;padding-left:22px}
.blk[data-t="p"]:empty::before,.blk[data-t="h2"]:empty::before,.blk[data-t="h3"]:empty::before{
      content:attr(data-ph);color:#ccc;pointer-events:none}
.blk a{color:inherit;text-decoration:underline;text-decoration-color:var(--light)}
.blk em{font-style:italic}.blk strong{font-weight:600}

.brow{position:relative}
.brow > .plus{position:absolute;left:-34px;top:0;width:24px;height:24px;border-radius:5px;border:1px solid var(--line);
      background:#fff;color:var(--light);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:16px;line-height:1}
.brow:hover > .plus{display:flex}
.brow > .plus:hover{color:var(--ink);border-color:var(--mid)}

.rule{border:0;height:1px;width:88px;margin:40px auto;background:var(--line)}
.rulewrap{cursor:pointer}
.rulewrap.sel .rule{background:var(--accent);height:2px}

figure.fig{margin:40px 0;position:relative}
figure.fig img{width:100%;display:block;border:1px solid var(--line);background:#f4f4f4;min-height:60px}
figure.fig figcaption{font-size:.72rem;color:var(--light);margin-top:8px;font-style:italic;outline:0}
figure.fig figcaption:empty::before{content:"Add a caption…";color:#ccc}
figure.fig .del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:4px;
      padding:3px 8px;font-size:12px;cursor:pointer;display:none}
figure.fig:hover .del{display:block}
figure.fig .ref{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;
      border-radius:4px;padding:3px 8px;font-size:11px;font-family:ui-monospace,monospace}

/* chart scaffold — deliberately NOT a rendered chart. The figure draws on the
   published page; here it is a labelled slot you can move through the prose. */
.chartblk{margin:40px 0;border:1px solid var(--line);border-radius:8px;padding:14px 16px;position:relative;background:#fcfcfc}
.chartblk .cid{font-family:ui-monospace,monospace;font-size:11px;color:#fff;background:var(--accent);
      border-radius:4px;padding:2px 7px;display:inline-block;margin-bottom:9px}
.chartblk .ctitle{font-size:1rem;font-weight:600;outline:0;color:var(--ink)}
.chartblk .ctitle:empty::before{content:"Figure title…";color:#ccc}
.chartblk .csub{font-size:.85rem;line-height:1.55;color:var(--mid);margin-top:4px;outline:0}
.chartblk .csub:empty::before{content:"What the reader should see in it…";color:#ccc}
.chartblk .cnote{font-size:11px;color:var(--light);margin-top:11px;border-top:1px dashed var(--line);padding-top:8px}
.chartblk .del{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:4px;
      padding:3px 8px;font-size:12px;cursor:pointer;display:none}
.chartblk:hover .del{display:block}

/* photo row — the {{< photos >}} wrapper; 2-up on the page when it holds two */
.prow{margin:40px 0;position:relative;border:1px dashed var(--line);border-radius:8px;padding:12px}
.prow .pgridin{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.prow figure{margin:0;position:relative}
.prow img{width:100%;display:block;border:1px solid var(--line);background:#f4f4f4;aspect-ratio:3/2;object-fit:cover}
.prow figcaption{font-size:.72rem;color:var(--light);margin-top:6px;font-style:italic;outline:0}
.prow figcaption:empty::before{content:"Caption…";color:#ccc}
.prow .rdel{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:4px;
      padding:2px 7px;font-size:11px;cursor:pointer;display:none}
.prow figure:hover .rdel{display:block}
.prow .addph{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 9px;cursor:pointer;font-size:12px}
.prow .addph:hover{border-color:var(--mid)}
.prow > .del{position:absolute;top:-10px;right:10px;background:#fff;border:1px solid var(--line);border-radius:4px;
      padding:2px 8px;font-size:11px;cursor:pointer;display:none;color:var(--mid)}
.prow:hover > .del{display:block}
.prow .miss{font-size:11px;color:#b3872a;margin-top:4px}

/* picker tabs */
#pick .tabs{display:flex;gap:4px}
#pick .tab{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12.5px}
#pick .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#pick .cell .k{font-size:10.5px;color:var(--light);word-break:break-all;line-height:1.35}
#pick .cell .tag{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;background:#eef3fa;
      color:var(--accent);border-radius:3px;padding:1px 5px;margin-bottom:3px}

/* bubble toolbar */
#bub{position:absolute;z-index:60;display:none;gap:2px;background:#111;border-radius:7px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.28)}
#bub button{background:none;border:0;color:#eee;padding:5px 9px;border-radius:4px;cursor:pointer;font-size:13px}
#bub button:hover{background:#333}
#bub .sep{width:1px;background:#444;margin:4px 2px}

/* insert menu */
#menu{position:absolute;z-index:60;display:none;background:#fff;border:1px solid var(--line);border-radius:8px;
      box-shadow:0 8px 28px rgba(0,0,0,.14);padding:5px;min-width:190px}
#menu button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:none;
      padding:7px 10px;border-radius:5px;cursor:pointer;font-size:13px}
#menu button:hover{background:#f2f2f2}
#menu .ic{width:18px;color:var(--light);text-align:center}

/* photo picker */
#pick,#cpick{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:70}
#pick .box,#cpick .box{background:#fff;border-radius:10px;width:min(880px,92vw);max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
#pick header,#cpick header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#pick .grid,#cpick .grid{padding:14px;overflow:auto;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
#pick .cell,#cpick .cell{border:1px solid var(--line);border-radius:7px;overflow:hidden;cursor:pointer;background:none;padding:0;text-align:left}
#pick .cell:hover,#cpick .cell:hover{border-color:var(--ink)}
#pick .cell img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;background:#eee}
#pick .cell .warn{font-size:10.5px;color:#b3872a;margin-top:3px;line-height:1.3}
#pick .cell[data-withheld]{opacity:.55}
#pick .cell .r{font-family:ui-monospace,monospace;font-size:11px;padding:5px 7px;color:var(--ink)}
#pick .empty,#cpick .empty{padding:28px;color:var(--mid);line-height:1.6}
#pick .empty code{background:#f2f2f2;padding:1px 5px;border-radius:3px}
</style>

<div id="rail"><h2>Essays</h2><div id="list"></div></div>
<div id="main">
  <div id="topbar">
    <span class="status" id="status">—</span>
    <span class="sp"></span>
    <span class="status" id="stats"></span>
    <button class="tb" id="preview">Preview ↗</button>
  </div>
  <div id="doc">
    <div id="meta"></div>
    <div id="title"    contenteditable="plaintext-only" data-ph="Title"></div>
    <div id="subtitle" contenteditable="plaintext-only" data-ph="Subtitle"></div>
    <div id="blocks"></div>
  </div>
</div>

<div id="bub">
  <button data-c="bold"><b>B</b></button>
  <button data-c="italic"><i>I</i></button>
  <button data-c="link">link</button>
  <span class="sep"></span>
  <button data-c="h2">H2</button>
  <button data-c="h3">H3</button>
  <button data-c="quote">&rdquo;</button>
  <button data-c="p">¶</button>
</div>

<div id="menu">
  <button data-i="h2"><span class="ic">H</span>Heading</button>
  <button data-i="h3"><span class="ic">h</span>Subheading</button>
  <button data-i="quote"><span class="ic">&rdquo;</span>Quote</button>
  <button data-i="ul"><span class="ic">•</span>Bulleted list</button>
  <button data-i="ol"><span class="ic">1.</span>Numbered list</button>
  <button data-i="hr"><span class="ic">—</span>Divider</button>
  <button data-i="photo"><span class="ic">▣</span>Photo…</button>
  <button data-i="photos"><span class="ic">▥</span>Photo row</button>
  <button data-i="chart"><span class="ic">▤</span>Chart…</button>
</div>

<div id="pick"><div class="box">
  <header><strong>Insert a photo</strong>
    <span class="tabs"><button class="tab on" data-mode="ref">By ref</button><button class="tab" data-mode="all">All photos</button></span>
    <span style="flex:1"></span>
    <input id="pq" type="search" placeholder="ref, city, neighbourhood, filename, tag notes…" style="border:1px solid var(--line);border-radius:5px;padding:4px 8px;min-width:280px">
    <button class="tb" id="pclose">Close</button></header>
  <div class="grid" id="pgrid"></div>
</div></div>

<div id="cpick"><div class="box">
  <header><strong>Insert a chart</strong><span style="flex:1"></span><button class="tb" id="cclose">Close</button></header>
  <div class="grid" id="cgrid" style="grid-template-columns:1fr"></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
let ESSAYS = [], REFS = [], CUR = null, BLOCKS = [], dirty = false, saveTimer = null;

/* ─────────────────────────── load ─────────────────────────── */
async function boot(){
  const d = await (await fetch('/api/essays')).json();
  ESSAYS = d.essays; REFS = d.refs;
  $('#list').innerHTML = ESSAYS.map(e =>
    `<button class="ess" data-s="${e.slug}">
       <div class="t">${esc(e.title)}</div>
       <div class="m">${(e.date||'').slice(0,10)} · ${e.words} words · ${e.blocks} blocks</div>
     </button>`).join('');
  openEssay(ESSAYS[0].slug);
}
function fmtDate(v){
  if (!v) return '';
  const t = Date.parse(v);
  return isNaN(t) ? v : new Date(t).toLocaleDateString(undefined,
    {year:'numeric', month:'long', day:'numeric'});
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function openEssay(slug){
  if (dirty) await save(true);
  const d = await (await fetch('/api/essay?slug='+encodeURIComponent(slug))).json();
  CUR = d; BLOCKS = d.blocks;
  document.querySelectorAll('.ess').forEach(b=>b.classList.toggle('on', b.dataset.s===slug));
  $('#title').textContent = d.front.title || '';
  $('#subtitle').textContent = d.front.subtitle || '';
  $('#meta').textContent = [d.front.category, fmtDate(d.front.date),
      d.front.series && ('Series: '+d.front.series)].filter(Boolean).join('  ·  ');
  render();
  setStatus('saved','opened');
  window.scrollTo(0,0);
}

/* ────────────────────────── render ────────────────────────── */
function blockHTML(b, i){
  if (b.type === 'hr')
    return `<div class="brow"><button class="plus" data-at="${i}">+</button>
            <div class="rulewrap" data-i="${i}"><hr class="rule"></div></div>`;
  if (b.type === 'image' || b.type === 'photo'){
    const src = b.type==='image' ? b.src
              : (b.thumb ? '/thumb/'+b.thumb : refSrc(b.ref));
    const name = b.ref ? '#'+b.ref : (b.key||'').split('/').pop();
    const badge = b.type==='photo' ? `<span class="ref">${esc(name)}</span>` : '';
    return `<div class="brow"><button class="plus" data-at="${i}">+</button>
      <figure class="fig" data-i="${i}">
        <button class="del" data-del="${i}">remove</button>${badge}
        <img src="${esc(src)}" alt="" loading="lazy">
        <figcaption contenteditable data-cap="${i}">${esc(b.caption||'')}</figcaption>
      </figure></div>`;
  }
  if (b.type === 'chart'){
    return `<div class="brow"><button class="plus" data-at="${i}">+</button>
      <div class="chartblk" data-i="${i}">
        <button class="del" data-del="${i}">remove</button>
        <span class="cid">${esc(b.id||'(no id)')}</span>
        <div class="ctitle" contenteditable data-ctitle="${i}">${esc(b.title||'')}</div>
        <div class="csub" contenteditable data-csub="${i}">${esc(b.sub||'')}</div>
        <div class="cnote">Drawn on the page by this piece&rsquo;s chart script, which finds it by
          id.${b.model?' Model table on.':''}${b.h?' Height '+esc(b.h)+'px.':''}</div>
      </div></div>`;
  }
  if (b.type === 'photos'){
    const cells = (b.items||[]).map((it,j)=>{
      const name = it.ref ? '#'+it.ref : (it.key||'').split('/').pop();
      return `<figure>
        <button class="rdel" data-rdel="${i}:${j}">✕</button>
        ${it.thumb ? `<img src="/thumb/${esc(it.thumb)}" loading="lazy" alt="">`
                   : `<img alt=""><div class="miss">⚠ ${esc(name)} resolves to nothing</div>`}
        <figcaption contenteditable data-rcap="${i}:${j}">${esc(it.caption||'')}</figcaption>
      </figure>`;
    }).join('');
    return `<div class="brow"><button class="plus" data-at="${i}">+</button>
      <div class="prow" data-i="${i}">
        <button class="del" data-del="${i}">remove row</button>
        <div class="pgridin">${cells}</div>
        <button class="addph" data-addrow="${i}">+ add a photo to this row</button>
      </div></div>`;
  }
  if (b.type === 'ul' || b.type === 'ol'){
    const tag = b.type==='ul'?'ul':'ol';
    return `<div class="brow"><button class="plus" data-at="${i}">+</button>
      <${tag} class="blk" data-t="${b.type}" data-i="${i}" contenteditable>
        ${(b.items||[]).map(x=>`<li>${x}</li>`).join('')}
      </${tag}></div>`;
  }
  const ph = b.type==='p' ? 'Write…' : (b.type==='h2'?'Heading':'Subheading');
  return `<div class="brow"><button class="plus" data-at="${i}">+</button>
    <div class="blk" data-t="${b.type}" data-i="${i}" data-ph="${ph}" contenteditable>${b.html||''}</div></div>`;
}
function refSrc(ref){
  const r = REFS.find(x=>x.ref===ref);
  return r && r.thumb ? '/thumb/'+r.thumb : '';
}
function render(){
  $('#blocks').innerHTML = BLOCKS.map(blockHTML).join('');
  updStats();
}
function updStats(){
  const w = BLOCKS.reduce((a,b)=>a + ((b.html||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(Boolean).length), 0);
  const figs = BLOCKS.filter(b=>b.type==='chart').length;
  const pics = BLOCKS.reduce((a,b)=>a + (b.type==='photo'?1:0) + (b.type==='photos'?(b.items||[]).length:0), 0);
  $('#stats').textContent = `${BLOCKS.length} blocks · ${w} words`
    + (figs?` · ${figs} figure${figs>1?'s':''}`:'') + (pics?` · ${pics} photo${pics>1?'s':''}`:'');
}

/* ──────────────────── read the DOM back ───────────────────── */
function inlineMD(el){
  let out = '';
  el.childNodes.forEach(n=>{
    if (n.nodeType === 3){ out += n.nodeValue; return; }
    const t = n.tagName ? n.tagName.toLowerCase() : '';
    const inner = inlineMD(n);
    if (t==='b'||t==='strong' || t==='i'||t==='em'){
      // Move whitespace OUTSIDE the markers instead of discarding it. Chrome's
      // double-click selection includes the trailing space, so trimming it
      // turned "say hello world" into "say **hello**world" -> "helloworld".
      const m = inner.match(/^(\s*)([\s\S]*?)(\s*)$/);
      const mk = (t==='b'||t==='strong') ? '**' : '*';
      out += m[2] ? m[1]+mk+m[2]+mk+m[3] : inner;
    }
    else if (t==='a') out += '['+inner+']('+(n.getAttribute('href')||'')+')';
    else if (t==='br') out += ' ';
    else out += inner;
  });
  return out;
}
function harvest(){
  BLOCKS.forEach((b,i)=>{
    if (b.type==='hr') return;
    if (b.type==='image'||b.type==='photo'){
      const cap = document.querySelector(`[data-cap="${i}"]`);
      if (cap) b.caption = cap.textContent.trim();
      return;
    }
    if (b.type==='chart'){
      const t = document.querySelector(`[data-ctitle="${i}"]`);
      const u = document.querySelector(`[data-csub="${i}"]`);
      if (t) b.title = t.textContent.trim();
      if (u) b.sub = u.textContent.trim();
      return;
    }
    if (b.type==='photos'){
      (b.items||[]).forEach((it,j)=>{
        const c = document.querySelector(`[data-rcap="${i}:${j}"]`);
        if (c) it.caption = c.textContent.trim();
      });
      return;
    }
    const el = document.querySelector(`.blk[data-i="${i}"]`);
    if (!el) return;
    if (b.type==='ul'||b.type==='ol'){
      b.items = [...el.querySelectorAll('li')].map(li=>inlineMD(li).trim()).filter(Boolean);
      b.items_are_md = true;
      b.md = '';
    } else {
      b.md = inlineMD(el).replace(/\s+/g,' ').trim();
      b.html = el.innerHTML;
    }
  });
}

/* ───────────────────────── saving ─────────────────────────── */
function setStatus(cls,msg){ const s=$('#status'); s.className='status '+cls; s.textContent=msg; }
function touch(){
  dirty = true; setStatus('saving','unsaved…');
  clearTimeout(saveTimer); saveTimer = setTimeout(()=>save(), 900);
}
async function save(sync){
  if (!CUR) return;
  harvest(); updStats();
  const front = { title: $('#title').textContent.trim(), subtitle: $('#subtitle').textContent.trim() };
  const body = JSON.stringify({slug:CUR.slug, front, blocks:BLOCKS});
  setStatus('saving','saving…');
  try{
    const r = await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body});
    const j = await r.json().catch(()=>({}));
    if (!r.ok || j.ok === false){
      // A refusal (e.g. the server's shrink guard) must NOT read as "saved" —
      // the editor would keep going and the work would exist nowhere.
      setStatus('saving', 'NOT SAVED — ' + (j.error || r.status));
      return;
    }
    dirty = false;
    setStatus('saved', 'saved · '+new Date().toLocaleTimeString());
  }catch(e){ setStatus('saving','SAVE FAILED — '+e.message); }
}
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* ───────────────────────── editing ────────────────────────── */
$('#blocks').addEventListener('input', touch);
$('#title').addEventListener('input', touch);
$('#subtitle').addEventListener('input', touch);

$('#blocks').addEventListener('keydown', e=>{
  const el = e.target.closest('.blk');
  if (!el) return;
  const i = +el.dataset.i, t = el.dataset.t;
  if (e.key === 'Enter' && !e.shiftKey && t !== 'ul' && t !== 'ol'){
    e.preventDefault();
    harvest();
    BLOCKS.splice(i+1, 0, {type:'p', html:'', md:''});
    render(); touch();
    focusBlock(i+1);
  }
  if (e.key === 'Backspace' && el.textContent === '' && BLOCKS.length > 1){
    e.preventDefault();
    harvest(); BLOCKS.splice(i,1); render(); touch();
    focusBlock(Math.max(0,i-1), true);
  }
  if ((e.metaKey||e.ctrlKey) && e.key==='s'){ e.preventDefault(); save(); }
});
function focusBlock(i, end){
  const el = document.querySelector(`.blk[data-i="${i}"]`);
  if (!el) return;
  el.focus();
  if (end){ const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
            const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
}

/* bubble toolbar */
const bub = $('#bub');
document.addEventListener('selectionchange', ()=>{
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed){ bub.style.display='none'; return; }
  const el = s.anchorNode && (s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement);
  if (!el || !el.closest('.blk')){ bub.style.display='none'; return; }
  const r = s.getRangeAt(0).getBoundingClientRect();
  bub.style.display='flex';
  bub.style.top = (window.scrollY + r.top - bub.offsetHeight - 9)+'px';
  bub.style.left = (window.scrollX + r.left + r.width/2 - bub.offsetWidth/2)+'px';
});
bub.addEventListener('mousedown', e=>{
  const b = e.target.closest('button'); if(!b) return;
  e.preventDefault();
  const c = b.dataset.c;
  if (c==='bold') document.execCommand('bold');
  else if (c==='italic') document.execCommand('italic');
  else if (c==='link'){ const u = prompt('Link URL'); if(u) document.execCommand('createLink',false,u); }
  else {
    const s=getSelection();
    const el = s.anchorNode && (s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement).closest('.blk');
    if (el){
      harvest();
      const bi = +el.dataset.i, blk = BLOCKS[bi];
      // Converting a list to a heading/quote/paragraph used to drop every item
      // on the floor: items live in .items, but the new type renders .html.
      if (blk.items && blk.items.length){
        blk.md = blk.items.join(' ');
        blk.html = blk.md.replace(/&/g,'&amp;').replace(/</g,'&lt;');
        delete blk.items; delete blk.items_are_md;
      }
      blk.type = c; render(); focusBlock(bi, true);
    }
  }
  touch();
});

/* insert menu */
const menu = $('#menu'); let insertAt = 0;
$('#blocks').addEventListener('click', e=>{
  const p = e.target.closest('.plus');
  if (p){
    insertAt = +p.dataset.at;
    const r = p.getBoundingClientRect();
    menu.style.display='block';
    menu.style.top=(window.scrollY+r.bottom+6)+'px';
    menu.style.left=(window.scrollX+r.left)+'px';
    return;
  }
  const rd = e.target.closest('[data-rdel]');
  if (rd){
    harvest();
    const [bi,ji] = rd.dataset.rdel.split(':').map(Number);
    BLOCKS[bi].items.splice(ji,1);
    // An empty row would serialise to nothing, so drop the wrapper with it.
    if (!BLOCKS[bi].items.length) BLOCKS.splice(bi,1);
    render(); touch(); return;
  }
  const ar = e.target.closest('[data-addrow]');
  if (ar){ harvest(); pickTarget = {row:+ar.dataset.addrow}; openPicker(); return; }
  const d = e.target.closest('[data-del]');
  if (d){ harvest(); BLOCKS.splice(+d.dataset.del,1); render(); touch(); return; }
  menu.style.display='none';
});
document.addEventListener('click', e=>{
  if (!e.target.closest('#menu') && !e.target.closest('.plus')) menu.style.display='none';
});
menu.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const kind = b.dataset.i;
  menu.style.display='none';
  harvest();
  if (kind==='photo'){ pickTarget = null; openPicker(); return; }
  if (kind==='photos'){
    // Create the row and immediately pick its first photo — an empty row has
    // nothing to show and serialises to nothing.
    BLOCKS.splice(insertAt, 0, {type:'photos', items:[]});
    render(); pickTarget = {row: insertAt}; openPicker(); return;
  }
  if (kind==='chart'){ openChartPicker(); return; }
  const blk = kind==='hr' ? {type:'hr'}
            : (kind==='ul'||kind==='ol') ? {type:kind, items:['']}
            : {type:kind, html:'', md:''};
  BLOCKS.splice(insertAt, 0, blk);
  render(); touch();
  if (kind!=='hr') focusBlock(insertAt);
});

/* ─────────────────────── photo picker ───────────────────────
   Two ways to name a photo. `ref` is the stable one — a slug set in the tagger
   that survives re-crops and R2 path changes — but only a handful of photos
   carry one, so `key` (the manifest path) is the escape hatch, searched
   server-side because the library is 4,000+ frames. Withheld photos are shown
   and MARKED rather than hidden: they render nothing on the page, and that is
   better learned here than at deploy time.
   `pickTarget` is null to insert a standalone photo block, or {row:i} to
   append into that photo row. */
let pickMode = 'ref', pickTarget = null, pickTimer = null;

function pickCell(o){
  const withheld = o.withheld ? ' data-withheld' : '';
  const warn = o.withheld ? '<div class="warn">⦸ withheld — renders nothing</div>' : '';
  if (pickMode === 'ref')
    return `<button class="cell" data-r="${esc(o.ref)}"${withheld}>
       <img src="/thumb/${esc(o.thumb)}" loading="lazy" alt="">
       <div class="r">#${esc(o.ref)}<br><span style="color:#999">${esc(o.city||'')}</span>${warn}
       ${o.dupes?`<div class="warn">⚠ ${o.dupes} other photo${o.dupes>1?'s':''} share this ref</div>`:''}</div>
     </button>`;
  return `<button class="cell" data-k="${esc(o.key)}" data-r="${esc(o.ref||'')}"${withheld}>
     <img src="/thumb/${esc(o.thumb)}" loading="lazy" alt="">
     <div class="r">${o.ref?`<span class="tag">#${esc(o.ref)}</span><br>`:''}
       <span class="k">${esc(o.key)}</span><br>
       <span style="color:#999">${esc([o.nbhd,o.city].filter(Boolean).join(', '))}</span>${warn}</div>
   </button>`;
}

async function openPicker(){
  $('#pick').style.display='flex';
  const q = ($('#pq').value||'').trim();
  let rows;
  if (pickMode === 'ref'){
    const lq = q.toLowerCase();
    rows = REFS.filter(r=>!lq || (r.ref+' '+(r.city||'')).toLowerCase().includes(lq));
    if (!rows.length){
      $('#pgrid').innerHTML = `<div class="empty">No photos carry an essay ref${q?' matching that':''} yet.<br><br>
        Set one in the photo tagger on <code>:8800</code> (a photo's <b>Essay ref</b> field), or switch to
        <b>All photos</b> to insert this one by its manifest key.</div>`;
      return;
    }
  } else {
    const d = await (await fetch('/api/photos?q='+encodeURIComponent(q))).json();
    rows = d.photos;
    if (!rows.length){
      $('#pgrid').innerHTML = `<div class="empty">Nothing matches “${esc(q)}”.<br><br>
        Search runs over the filename, city, neighbourhood and the tagger's notes.</div>`;
      return;
    }
  }
  $('#pgrid').innerHTML = rows.map(pickCell).join('');
}

$('#pq').addEventListener('input', ()=>{
  // The all-photos mode hits the server, so debounce it.
  clearTimeout(pickTimer);
  pickTimer = setTimeout(openPicker, pickMode==='ref' ? 0 : 160);
});
document.querySelectorAll('#pick .tab').forEach(t=>t.addEventListener('click', ()=>{
  pickMode = t.dataset.mode;
  document.querySelectorAll('#pick .tab').forEach(x=>x.classList.toggle('on', x===t));
  openPicker();
}));
$('#pclose').addEventListener('click', closePicker);
$('#pick').addEventListener('click', e=>{ if(e.target.id==='pick') closePicker(); });
function closePicker(){
  $('#pick').style.display='none';
  // A row created for a pick that was then cancelled would be an empty
  // wrapper: drop it rather than leave a stray dashed box.
  if (pickTarget && BLOCKS[pickTarget.row] && !(BLOCKS[pickTarget.row].items||[]).length){
    harvest();
    BLOCKS.splice(pickTarget.row,1);
    render();
  }
  pickTarget = null;
}
$('#pgrid').addEventListener('click', e=>{
  const c = e.target.closest('.cell'); if(!c) return;
  // Prefer the ref when the photo has one: it is the name that survives.
  const item = c.dataset.r ? {ref:c.dataset.r, caption:''}
                           : {key:c.dataset.k, caption:''};
  const tgt = pickTarget;
  $('#pick').style.display='none';
  pickTarget = null;
  if (tgt && BLOCKS[tgt.row]) BLOCKS[tgt.row].items.push(item);
  else BLOCKS.splice(insertAt, 0, Object.assign({type:'photo'}, item));
  render();                        // resync the DOM before anything harvests it
  save().then(()=>reload());       // reload so the server attaches the thumb
});

/* ─────────────────────── chart picker ───────────────────────
   The ids offered are the ones this piece's own script binds to. A chart
   scaffold with any other id renders an empty box, silently. */
async function openChartPicker(){
  $('#cpick').style.display='flex';
  const d = await (await fetch('/api/charts?slug='+encodeURIComponent(CUR.slug))).json();
  $('#cgrid').innerHTML = d.charts.length ? d.charts.map(c=>
      `<button class="cell" data-c="${esc(c.id)}" style="padding:10px 12px">
         <span class="tag" style="font-size:11px">${esc(c.id)}</span>
         <div class="k" style="margin-top:4px">${c.placed?'already placed in this piece':'not yet placed'}</div>
       </button>`).join('')
    : `<div class="empty">This piece loads no chart script, so there are no figure ids to place.<br><br>
        Add one to its front matter — <code>scripts:</code> with
        <code>js/vendor/chart.umd.js</code>, <code>js/charts.js</code> and
        <code>js/work/&lt;slug&gt;.js</code> — then write the chart in that file.</div>`;
}
$('#cclose').addEventListener('click', ()=> $('#cpick').style.display='none');
$('#cpick').addEventListener('click', e=>{ if(e.target.id==='cpick') $('#cpick').style.display='none'; });
$('#cgrid').addEventListener('click', e=>{
  const c = e.target.closest('.cell'); if(!c) return;
  $('#cpick').style.display='none';
  BLOCKS.splice(insertAt, 0, {type:'chart', id:c.dataset.c, title:'', sub:'', h:'', model:false});
  render(); touch();
});

async function reload(){
  const at = window.scrollY;
  const d = await (await fetch('/api/essay?slug='+encodeURIComponent(CUR.slug))).json();
  CUR = d; BLOCKS = d.blocks; render(); window.scrollTo(0, at);
}

$('#list').addEventListener('click', e=>{
  const b = e.target.closest('.ess'); if(b) openEssay(b.dataset.s);
});
$('#preview').addEventListener('click', async ()=>{
  await save();
  window.open('http://localhost:1313/work/'+CUR.slug+'/','_blank');
});
boot();
</script>
