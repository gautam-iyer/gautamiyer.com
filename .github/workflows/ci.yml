name: CI

# Cloudflare Pages builds and deploys on push regardless of this workflow, so
# treat a red run as "the deploy that already happened may be broken" rather
# than as a gate. The point is to catch the two things that have actually
# shipped bad before: a manifest that violates the publish gate, and a template
# change that doesn't build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must match hugo.toml's expectations and the HUGO_VERSION configured in
      # the Cloudflare Pages dashboard. CF's default is too old for hugo.Data.
      HUGO_VERSION: 0.159.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -sSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Validate data
        # Invariants that have caused a bad publish. Warnings (an unflagged
        # place cover, a city with no collection) are curation calls and do not
        # fail the run — add --strict to change that.
        run: python3 scripts/validate.py

      - name: Build
        # `hugo` does not clean public/, so stale output can mask a removed
        # page. Build from scratch.
        run: |
          rm -rf public
          hugo --gc --minify

      - name: Check the 404 page exists
        # Without public/404.html, Cloudflare Pages serves the HOMEPAGE with
        # HTTP 200 for every unknown URL, so a broken link looks fine forever.
        run: test -s public/404.html

      - name: Report build output
        run: |
          echo "pages built: $(find public -name '*.html' | wc -l)"
          du -sh public
